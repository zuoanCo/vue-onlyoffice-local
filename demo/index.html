    <!-- Crawlers that do not execute JavaScript still get the substance here.

    <noscript>
      <main>
        <h1>vue-onlyoffice-local</h1>
        <p>
          A Vue 3 plugin for purely local OnlyOffice document editing. It opens and
          edits DOCX, XLSX and PPTX entirely in the browser: the file becomes a Blob
          URL, the editor kernel runs in an iframe, and the edited bytes are returned
          to the host component. There is no document server and nothing is uploaded.
        </p>
        <h2>Why it exists</h2>
        <ul>
          <li>No document server to deploy, license or keep online.</li>
          <li>Privacy first: the document never leaves the visitor's browser tab.</li>
          <li>Imperative <code>save()</code> returns the edited buffer over a postMessage file-stream hook.</li>
          <li>Three entry points: the <code>&lt;VueOnlyOfficeLocal&gt;</code> component, the <code>useOnlyOffice()</code> composable and the headless <code>createEditor()</code> SDK.</li>
          <li>TypeScript-first, MIT licensed.</li>
        </ul>
        <h2>Installation</h2>
        <pre><code>npm install @zzk-1015/vue-onlyoffice-local</code></pre>
        <h2>Usage</h2>
        <pre><code>import VueOnlyOfficeLocal from '@zzk-1015/vue-onlyoffice-local';

app.use(VueOnlyOfficeLocal, {
  defaultBaseUrl: '/',
  globalConfig: { editorConfig: { lang: 'en' } },
});</code></pre>
        <p>
          The live demo on this page needs JavaScript, because the editor itself runs
          in your browser. Source and full API reference:
          <a href="https://github.com/zuoanCo/vue-onlyoffice-local">github.com/zuoanCo/vue-onlyoffice-local</a>.
        </p>
      </main>
